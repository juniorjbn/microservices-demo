{{ define "error" }}
    {{ template "header" . }}
    <div {{ with $.platform_css }} class="platform-badge {{.}}" {{ end }}></div>
    <main>
        <div class="error-page">
            <h1>{{ t $.locale "something_went_wrong" }}</h1>
            <p>HTTP {{.status_code}} {{.status}}</p>
            <pre class="error-message">{{- .error -}}</pre>
        </div>
    </main>
    {{ template "footer" . }}
{{ end }}
